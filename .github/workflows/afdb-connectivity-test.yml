name: AfDB Browser Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-afdb:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test AfDB with Chromium
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://www.afdb.org/en/documents/category/specific-procurement-notices"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={"width": 1366, "height": 768},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36"
              )

              response = page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              page.wait_for_timeout(15000)

              print("HTTP STATUS:", response.status if response else "NO RESPONSE")
              print("FINAL URL:", page.url)
              print("TITLE:", page.title())

              html = page.content()
              print("HTML LENGTH:", len(html))

              challenge = (
                  "Just a moment" in page.title()
                  or "challenges.cloudflare.com" in html
              )

              if challenge:
                  print("FAIL: Cloudflare challenge still active.")
                  browser.close()
                  raise SystemExit(1)

              print("PASS: Chromium reached AfDB page.")
              browser.close()
          PY
